name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Every job only reads the repository. Without this block the GITHUB_TOKEN gets the
# repository default, which can be read/write, while the jobs run third-party code
# (npm/pip installs, hacs/action, codecov-action).
permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff and pip-audit
        # Pinned in requirements-lint.txt (kept current by Renovate) instead of
        # installing whatever is newest on PyPI at run time.
        run: pip install -r requirements-lint.txt

      - name: Run ruff check
        run: ruff check custom_components/evon/ tests/

      - name: Run ruff format check
        run: ruff format --check custom_components/evon/ tests/

      - name: Run pip-audit
        run: pip-audit -r requirements-test.txt
        continue-on-error: true  # advisory-only initially

      - name: Install mypy and dependencies
        run: pip install -r requirements-test.txt

      - name: Run mypy
        run: mypy custom_components/evon/ --ignore-missing-imports
        continue-on-error: true  # ~100 errors remain under mypy 2.x (100 at v1.23.0); tracked in docs/CODE_ANALYSIS_BACKLOG.md

  lint-typescript:
    name: Lint TypeScript (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        # 24 = the runtime floor in package.json engines; 26 = the current LTS.
        # Majors are picked by hand (Renovate rule); check-latest pulls the newest patch.
        node-version: ["24", "26"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

      - name: Run eslint
        run: npm run lint

      - name: Build TypeScript
        run: npm run build

      - name: Run MCP tests
        run: npm run test:mcp

  hacs-validation:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # HACS cuts no releases (latest tag is from 2022) — pin main by SHA
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-06-08
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # home-assistant/actions publishes no releases — pin master by SHA
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-11-05

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # HA 2026.x requires Python >=3.14.2, so 3.14 is the only supported runtime.
        python-version: ["3.14"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --cov=custom_components/evon --cov-report=xml --cov-report=term-missing --cov-fail-under=76

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
