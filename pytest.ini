[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
# Home Assistant (>= 2026.11) aliases httpx to httpx2 on import and fails if httpx
# was imported first; respx's pytest plugin does exactly that. pytest-homeassistant
# still uses respx directly, only the separate plugin is disabled (its README).
addopts = -p no:respx
